name: Bus Data Analyzer

on:
  schedule:
    # 台灣時間每天 00:30 執行 (UTC 16:30)
    - cron: '30 16 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: 下載專案檔案
        uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 執行資料分析
        run: python analyze.py

      - name: 存檔並推送回 GitHub
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add schedule.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Update schedule.json"
          git pull --rebase
          git push
