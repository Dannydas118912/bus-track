name: Bus Data Logger

on:
  schedule:
    # 台灣時間 06:07, 12:07, 18:07
    - cron: '7 4,10,22 * * *'
  workflow_dispatch:

concurrency:
  group: bus-logger
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  log-bus:
    runs-on: ubuntu-latest
    steps:
      - name: 下載專案檔案
        uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝套件
        run: pip install requests

      - name: 執行公車記錄器
        env:
          TDX_CLIENT_ID: ${{ secrets.TDX_CLIENT_ID }}
          TDX_CLIENT_SECRET: ${{ secrets.TDX_CLIENT_SECRET }}
        run: python bus_logger.py

      - name: 存檔並推送回 GitHub
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add bus_log.csv
          git diff --quiet && git diff --staged --quiet || git commit -m "Update bus_log.csv"
          git pull --rebase
          git push
